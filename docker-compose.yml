services:
  autobuddy:
    image: ghcr.io/deltrivx/autobuddy:latest
    container_name: AutoBuddy
    restart: unless-stopped
    ports:
      - "18090:18090"
      - "18091:18091"
    volumes:
      - ./autobuddy/data:/data
    environment:
      # 控制台登录凭据。二者一旦设置，界面上即锁定为不可修改，
      # 需改这里并重建容器才能变更。
      AUTH_USERNAME: "admin"
      AUTH_PASSWORD: "change-me"
      # 登录会话有效期（小时）
      AUTOBUDDY_SESSION_HOURS: "24"
      # 影响签到定时任务与统计流水的日期归属
      TZ: Asia/Shanghai
      # 容器内端口，一般无需修改；修改时两个端口映射需同步调整
      PORT: "18090"
      API_PORT: "18091"
      # WorkBuddy 每日成长任务（vendor 版签到脚本，账号池 cn 账号只读共用凭据）。
      # 服务跑在容器内网 18093，由 web_proxy 转发，不对外映射端口。
      WB_DAILY_ENABLED: "1"
      WB_DAILY_PORT: "18093"
