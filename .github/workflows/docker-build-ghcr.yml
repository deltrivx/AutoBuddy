name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - v*
    # 纯文档改动不重建镜像：README / CHANGELOG / 发布说明 / LICENSE 等
    # 不影响镜像内容，重建只会白白消耗 CI 并推进 latest 的 revision 标签。
    # 注意：tag（v*）触发不受 paths-ignore 影响，发版照常构建。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '_test_*.py'
      - '.github/ISSUE_TEMPLATE/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 本地单测。这些测试刻意不依赖 fastapi / httpx（自行 stub），因此不需要装任何包。
  # 它们覆盖的是「错了会静默改坏用户配置」的地方 —— 模型级禁用策略、可用性巡检判定、
  # 账号轮询与 API 鉴权。放在构建之前，保证问题镜像根本推不上去
  # （曾有一次探测请求体形态写错，导致一轮巡检把上百个好模型成批误禁）。
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: |
          set -e
          for f in _test_*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
