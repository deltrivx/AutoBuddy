name: Build and Push Docker Image

on:
  # 2026-10-24 架构修正：**只在打 tag 时构建一次**。
  #
  # 旧架构同时监听 push main 与 push tag，导致同一个 commit 被构建两遍：
  #   push main → 产出 latest（digest A）
  #   push tag  → 产出 1.0.29（digest B）
  # 两个 digest 内容相同但哈希不同，每次发版都要人工核对「它们是不是一个东西」——
  # 这本身就是设计缺陷。而且 main 上任何提交都会重推 latest，让 latest 指向一个
  # 尚未发版的中间状态。
  #
  # 新架构：一次构建，一个 digest，多个 tag 指向它。
  #   push tag v1.0.30 → 一次 build → 同时打上 1.0.30 与 latest
  # 于是「最新版」只有一个确定指向，release / latest / 版本号天然一致。
  push:
    tags:
      - 'v*'
  # 保留手动补建能力（补历史版本号、或修复某次构建失败）
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 本地单测。这些测试刻意不依赖 fastapi / httpx（自行 stub），因此不需要装任何包。
  # 它们覆盖的是「错了会静默改坏配置或让界面少一块」的地方 —— 模型级禁用策略、
  # 可用性巡检判定、账号轮询、API 鉴权、Token 用量统计、版本号一致性，
  # 以及 WebUI 注入面板的渲染（注入的 JS 一旦抛异常，那块面板会静默消失）。
  # 放在构建之前，保证问题镜像根本推不上去
  # （曾有一次探测请求体形态写错，一轮巡检把上百个好模型成批误禁；
  #   也曾有一次 JS 变量遮蔽让「关于」面板整块不显示）。
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # WebUI 注入面板的渲染冒烟测试需要 node 跑 DOM 桩。
      # 不显式提供的话，那个测试会「跳过」而不是失败 —— 门禁就形同虚设。
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Run unit tests
        # 2026-10-24：测试从根目录 _test_*.py 迁到 tests/（含 tests/legacy/），
        # 命名改为 pytest 标准的 test_*.py。显式设 working-directory 与 PYTHONPATH，
        # 让 `import gateway.*` 与相对仓库根的路径基准都稳定可达。
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          for f in tests/test_*.py tests/legacy/test_*.py; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 解析真实版本号，供镜像 label 使用。
      #
      # 2026-10-24 修复：此前 metadata-action 没有显式 labels:，它按默认行为把
      # org.opencontainers.image.version 设成「本次产出的第一个 tag 名」。于是
      # 推 latest 的那次构建，该 label 就成了字面量 "latest" 而不是真实版本号 ——
      # docker inspect 读出来分不清这个镜像到底是哪个版本。
      #
      # 这里改成从**单一版本源** gateway/main.py 的 VERSION_DEFAULT 解析。
      # 为什么不用 github.ref_name：它在 tag 场景是 "v1.0.28"（带 v，与 docker tag
      # 的 1.0.28 不一致），在 push main 场景是 "main"（完全不是版本号），
      # 还得写表达式剥前缀、且对 main 构建无能为力。
      # 为什么不用 steps.meta.outputs.version：同理会随 tag 形态漂移。
      # VERSION_DEFAULT 是 _test_version_sync.py 强制与 CHANGELOG 对齐的唯一源，
      # 任何场景下读它都能得到正确版本号。
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          V="$(grep -oP 'VERSION_DEFAULT\s*=\s*"\K[^"]+' gateway/main.py || true)"
          if [ -z "$V" ]; then
            echo "::error::无法从 gateway/main.py 解析 VERSION_DEFAULT"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "镜像版本号: $V"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 版本号规范：语义化 `vX.Y.Z` 三位制（feature 进 minor，bugfix 进 patch）。
          # 曾短暂试过四段日期制（v2026.10.21.03），已废弃 —— 它不是标准 semver，
          # `type=semver` 对它一条标签都产不出（源码里 semver.valid() 返回 null 后
          # 该规则静默跳过、不报错），tag 推送后 GHCR 会只剩 latest。
          # 剥 v 前缀用 type=match 的捕获组，不用 type=ref,event=tag ——
          # 后者**不剥 v**（源码 procRefTag() 只做 replace(/^refs\/tags\//)，
          # 官方文档表格也是 refs/tags/v1.2.3 → v1.2.3）。
          # 2026-10-21 实测踩过：v2026.10.21.03 被推成了 v2026.10.21.03。
          # type=match 抓组后，v1.0.11 → 1.0.11，再由 semver 规则补 1.0.11。
          # 注意：只保留 {{version}}，不保留 {{major}}.{{minor}} 浮动 tag。
          # 2026-10-23 陛下指出：同一个 digest 同时挂 1.0 和 1.0.27 两个 tag，
          # 看起来像两个版本，实际是同一个镜像 —— 浮动 tag 让版本号指代不清。
          # 需要锁定版本就用 :1.0.27，想跟进最新就用 :latest，二者语义明确。
          # 已存在的 7 个浮动 tag（0.1~0.9 与 1.0）已单独删除。
          # flavor latest=false：关掉 metadata-action 的 latest=auto。
          #
          # latest=auto（默认）的语义是「只要产出了 semver 形态的标签，就额外再推
          # 一条 latest」——它**不受下面 raw 规则的 enable 条件约束**。2026-10-23
          # 实测踩过：workflow_dispatch 到 refs/tags/v1.0.25（目的只是补一个版本号
          # 镜像，让 Unraid 的 :1.0.25 能拉回来），raw 规则已 enable=false，日志里
          # 也确实打印了 `type=raw,value=latest,enable=false`，但 latest=auto 仍然
          # 自主产出了一条 latest，把 latest 从上游 main 的构建悄悄改指到这个 tag
          # 构建上。补历史版本号这种操作不该有移动 latest 的副作用。
          #
          # 关掉 auto 之后，latest 的唯一决策点就是下面那条 raw 规则。
          # 2026-10-24 架构修正后，raw 规则的启用条件改成「ref 是 v* tag」——
          # 因为构建本身现在只在 tag 时发生，latest 与版本号必须同批产出。
          # 显式覆盖 OCI label，避免默认行为把 version 写成 tag 名（如 "latest"）。
          # version 取自上一步从 VERSION_DEFAULT 解析出的真实版本号；
          # revision 用 github.sha（commit 全 SHA），source 指向仓库。
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=AutoBuddy
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            # latest 与版本号由**同一次构建**产出，指向同一个 digest。
            # raw 规则产出的 "latest" 走的是 version.main 通道，不受声明的
            # flavor.latest 约束，所以下面保留 flavor: latest=false 只用于抑制
            # semver 规则额外附加的那条 latest（避免重复，虽有去重但语义更清楚）。
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
