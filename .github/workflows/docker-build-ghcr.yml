name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - v*
    # 纯文档改动不重建镜像：README / CHANGELOG / 发布说明 / LICENSE 等
    # 不影响镜像内容，重建只会白白消耗 CI 并推进 latest 的 revision 标签。
    # 注意：tag（v*）触发不受 paths-ignore 影响，发版照常构建。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '_test_*.py'
      - '.github/ISSUE_TEMPLATE/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 本地单测。这些测试刻意不依赖 fastapi / httpx（自行 stub），因此不需要装任何包。
  # 它们覆盖的是「错了会静默改坏配置或让界面少一块」的地方 —— 模型级禁用策略、
  # 可用性巡检判定、账号轮询、API 鉴权、Token 用量统计、版本号一致性，
  # 以及 WebUI 注入面板的渲染（注入的 JS 一旦抛异常，那块面板会静默消失）。
  # 放在构建之前，保证问题镜像根本推不上去
  # （曾有一次探测请求体形态写错，一轮巡检把上百个好模型成批误禁；
  #   也曾有一次 JS 变量遮蔽让「关于」面板整块不显示）。
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # WebUI 注入面板的渲染冒烟测试需要 node 跑 DOM 桩。
      # 不显式提供的话，那个测试会「跳过」而不是失败 —— 门禁就形同虚设。
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Run unit tests
        run: |
          set -e
          for f in _test_*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 版本号规范：语义化 `vX.Y.Z` 三位制（feature 进 minor，bugfix 进 patch）。
          # 曾短暂试过四段日期制（v2026.10.21.03），已废弃 —— 它不是标准 semver，
          # `type=semver` 对它一条标签都产不出（源码里 semver.valid() 返回 null 后
          # 该规则静默跳过、不报错），tag 推送后 GHCR 会只剩 latest。
          # 剥 v 前缀用 type=match 的捕获组，不用 type=ref,event=tag ——
          # 后者**不剥 v**（源码 procRefTag() 只做 replace(/^refs\/tags\//)，
          # 官方文档表格也是 refs/tags/v1.2.3 → v1.2.3）。
          # 2026-10-21 实测踩过：v2026.10.21.03 被推成了 v2026.10.21.03。
          # type=match 抓组后，v1.0.11 → 1.0.11，再由 semver 规则补 1.0.11。
          # 注意：只保留 {{version}}，不保留 {{major}}.{{minor}} 浮动 tag。
          # 2026-10-23 陛下指出：同一个 digest 同时挂 1.0 和 1.0.27 两个 tag，
          # 看起来像两个版本，实际是同一个镜像 —— 浮动 tag 让版本号指代不清。
          # 需要锁定版本就用 :1.0.27，想跟进最新就用 :latest，二者语义明确。
          # 已存在的 7 个浮动 tag（0.1~0.9 与 1.0）已单独删除。
          # flavor latest=false：关掉 metadata-action 的 latest=auto。
          #
          # latest=auto（默认）的语义是「只要产出了 semver 形态的标签，就额外再推
          # 一条 latest」——它**不受下面 raw 规则的 enable 条件约束**。2026-10-23
          # 实测踩过：workflow_dispatch 到 refs/tags/v1.0.25（目的只是补一个版本号
          # 镜像，让 Unraid 的 :1.0.25 能拉回来），raw 规则已 enable=false，日志里
          # 也确实打印了 `type=raw,value=latest,enable=false`，但 latest=auto 仍然
          # 自主产出了一条 latest，把 latest 从上游 main 的构建悄悄改指到这个 tag
          # 构建上。补历史版本号这种操作不该有移动 latest 的副作用。
          #
          # 关掉 auto 之后，latest 的唯一决策点就是下面那条 raw 规则：
          #   push main        → enable=true  → 推 latest（并在 build 后更新指向）
          #   release published → enable=true  → 推 latest
          #   push tag / dispatch 到 tag → enable=false 且 auto 已关 → 不推 latest
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
