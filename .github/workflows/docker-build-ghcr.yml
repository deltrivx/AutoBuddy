name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - v*
    # 纯文档改动不重建镜像：README / CHANGELOG / 发布说明 / LICENSE 等
    # 不影响镜像内容，重建只会白白消耗 CI 并推进 latest 的 revision 标签。
    # 注意：tag（v*）触发不受 paths-ignore 影响，发版照常构建。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '_test_*.py'
      - '.github/ISSUE_TEMPLATE/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 本地单测。这些测试刻意不依赖 fastapi / httpx（自行 stub），因此不需要装任何包。
  # 它们覆盖的是「错了会静默改坏配置或让界面少一块」的地方 —— 模型级禁用策略、
  # 可用性巡检判定、账号轮询、API 鉴权、Token 用量统计、版本号一致性，
  # 以及 WebUI 注入面板的渲染（注入的 JS 一旦抛异常，那块面板会静默消失）。
  # 放在构建之前，保证问题镜像根本推不上去
  # （曾有一次探测请求体形态写错，一轮巡检把上百个好模型成批误禁；
  #   也曾有一次 JS 变量遮蔽让「关于」面板整块不显示）。
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # WebUI 注入面板的渲染冒烟测试需要 node 跑 DOM 桩。
      # 不显式提供的话，那个测试会「跳过」而不是失败 —— 门禁就形同虚设。
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Run unit tests
        run: |
          set -e
          for f in _test_*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 版本号规范（哥哥 2026-10-21 定）：`vYYYY.MM.DD.NN` 四段日期制，
          # 末段是「当天第几版」，固定两位补零 —— v2026.10.21.01 / .09 / .10。
          # 四段号**不是标准 semver**：`type=semver` 对它一条标签都产不出
          # （源码里 semver.valid() 返回 null 后该规则静默跳过、不报错），
          # 于是 tag 推送时镜像会只剩 latest 或干脆没标签。
          # 因此版本标签靠下面这条 type=match 兜底，它不挑版本形态。
          # ⚠️ 为什么不用 type=ref,event=tag：它**不剥 v 前缀**
          # （源码 procRefTag() 只做 replace(/^refs\/tags\//)，官方文档表格
          # 也是 refs/tags/v1.2.3 → v1.2.3）。2026-10-21 实测踩过：
          # v2026.10.21.03 被推成了 v2026.10.21.03。
          # type=match 靠捕获组剥 v，四段和三段一视同仁：
          #   v2026.10.21.04 → 2026.10.21.04
          #   v1.0.11        → 1.0.11
          # 存量三段式的 x.y.z / x.y 标签仍由下面两条 semver 规则产出。
          # 注：type=match / type=semver 在 latest=auto 下各产一条 latest，
          # 与上面那条 raw latest 会重复，buildx 自动去重，无实际影响。
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
